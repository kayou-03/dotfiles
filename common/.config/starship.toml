format = "$username$directory$git_branch$git_status$character"

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold yellow"

[directory]
style = "bold cyan"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
